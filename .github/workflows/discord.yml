name: Discord Message
on:
  push:
    branches: [main, uat, dev]
  pull_request:
    branches: [main, uat, dev]

jobs:
  discord-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification for Push
        if: github.event_name == 'push'
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#48f442"
          username: "The Lab Bot"
          message: |
            🚀 **New Push to Repository**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.event.head_commit.author.name }}
            **Commit:** ${{ github.event.head_commit.message }}
            
            [View Changes](${{ github.event.head_commit.url }})

      - name: Send Discord Notification for Pull Request
        if: github.event_name == 'pull_request'
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#4285f4"
          username: "The Lab Bot"
          message: |
            🔄 **Pull Request ${{ github.event.action }}**
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}
            **Author:** ${{ github.event.pull_request.user.login }}
            **Title:** ${{ github.event.pull_request.title }}
            
            [View Pull Request](${{ github.event.pull_request.html_url }})